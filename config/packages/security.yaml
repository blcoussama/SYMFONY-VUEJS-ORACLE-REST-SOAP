security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Chaque rôle hérite des droits du précédent (SPEC §1).
    role_hierarchy:
        ROLE_TECHNICIEN: [ROLE_AGENT]
        ROLE_SUPERVISEUR: [ROLE_TECHNICIEN]
        ROLE_ADMIN: [ROLE_SUPERVISEUR]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # Clé d'API partenaire : recherche par empreinte SHA-256 (la clé en clair n'est jamais stockée).
        api_client_provider:
            entity:
                class: App\Entity\ApiClient
                property: keyHash

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # SOAP : l'authentification par clé est faite par le service SOAP lui-même,
        # pour répondre par des fautes SOAP (Client.Unauthorized) et non par du HTML.
        soap:
            pattern: ^/soap/
            security: false
        # Appels partenaires : /api/... avec un en-tête X-API-Key, sans session.
        api_key:
            request_matcher: App\Security\ApiKeyRequestMatcher
            stateless: true
            provider: api_client_provider
            user_checker: App\Security\ApiClientChecker
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
        # Application web (et API REST appelée par le Kanban avec la session).
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\AuthenticationEntryPoint
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Seule la première règle qui correspond s'applique. Les contrôles fins (technicien
    # assigné, etc.) sont faits par les Voters et les gardes du Workflow.
    access_control:
        - { path: ^/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: [ROLE_AGENT, ROLE_API_PARTNER] }
        - { path: ^/admin/, roles: ROLE_ADMIN }
        - { path: ^/tableau-de-bord, roles: ROLE_SUPERVISEUR }
        - { path: ^/mes-interventions, roles: ROLE_TECHNICIEN }
        - { path: ^/, roles: ROLE_AGENT }

when@test:
    security:
        password_hashers:
            # Hachage volontairement rapide en test uniquement.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
