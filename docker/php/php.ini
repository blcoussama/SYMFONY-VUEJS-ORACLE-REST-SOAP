; NetOps — surcharge de php.ini-production (copiée en conf.d/zz-netops.ini).
expose_php = Off
memory_limit = 256M
max_execution_time = 30
date.timezone = UTC
upload_max_filesize = 2M
post_max_size = 4M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions : cookie non accessible en JavaScript, mode strict.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; OPcache : le code de l'image ne change pas, inutile de vérifier les dates.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; WSDL : le cache disque de ext-soap irait dans /tmp ; on garde le cache mémoire.
soap.wsdl_cache_enabled = 1
soap.wsdl_cache = 2
