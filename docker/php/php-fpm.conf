; NetOps — pool php-fpm (chargé après www.conf et zz-docker.conf de l'image officielle).
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
; Transmet l'environnement du conteneur (DATABASE_URL, APP_SECRET...) à PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Les journaux d'accès sont tenus par nginx.
access.log = /dev/null

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Sonde de santé (HEALTHCHECK) : non exposée par nginx.
ping.path = /ping
ping.response = pong
